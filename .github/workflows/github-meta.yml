name: Refresh GitHub Metadata

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC, before the website's daily refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enrich package metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_meta.py

      - name: Discover candidate packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_meta.py --discover

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github_meta.json data/CANDIDATES.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh GitHub metadata + candidate discovery"
            git push
          fi
