name: Validate CSVs

on:
  push:
    branches: [main]
    paths: ['data/**', 'schema/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'schema/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate data against schemas
        run: python scripts/validate_data.py

  # Notify the website repo (asmbatati/ros_database) that the dataset changed,
  # so it can regenerate its static JSON and redeploy. Requires a fine-grained
  # PAT with "Contents: read+write" on ros_database, stored as the
  # WEBSITE_DISPATCH_TOKEN secret. Skipped silently if the secret is not set —
  # the website also refreshes itself on a schedule.
  notify-website:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger website data refresh
        if: env.TOKEN != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/asmbatati/ros_database/dispatches \
            -d '{"event_type":"data-updated"}'
