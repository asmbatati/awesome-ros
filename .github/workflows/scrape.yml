name: Scrape New Papers

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Scrape papers published after this date (YYYY-MM-DD). Default: 45 days ago.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The branch is rebuilt from main on every run, so the PR only ever
      # contains "main + whatever this run found". A window shorter than the
      # review latency silently drops papers off the back of an unmerged PR.
      # 365d gives a year of slack; duplicates are cheap (dedup by DOI+title).
      - name: Run scraper
        env:
          # Optional. Without it OpenAlex bills the runner IP's shared
          # anonymous budget, which other Actions users routinely exhaust (429).
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          SINCE="${{ github.event.inputs.since }}"
          if [ -z "$SINCE" ]; then SINCE=$(date -d '365 days ago' +%Y-%m-%d); fi
          echo "SCRAPE_SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "Scraping papers published since $SINCE"
          python scripts/scrape_papers.py --since "$SINCE"

      # Validate here too, so a bad scrape never reaches a PR at all.
      - name: Validate result
        run: python scripts/validate_data.py

      # SCRAPE_PR_TOKEN (fine-grained PAT, this repo only: Contents +
      # Pull requests read/write) makes the PR authored by the owner, so the
      # validate workflow runs on it straight away. With the GITHUB_TOKEN
      # fallback the PR comes from github-actions[bot], whose checks sit in
      # "awaiting approval from a maintainer" until approved by hand.
      - name: Check PR token
        env:
          T: ${{ secrets.SCRAPE_PR_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::SCRAPE_PR_TOKEN is unset or empty; PR will be opened by github-actions[bot] and its checks will await manual approval."
          else
            echo "SCRAPE_PR_TOKEN present (${#T} chars)"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SCRAPE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'data: weekly paper scrape from OpenAlex'
          title: '[Auto] New papers from OpenAlex'
          body: |
            Automated weekly scrape of new ROS / ROS 2 papers from OpenAlex.

            **Publication window: ${{ env.SCRAPE_SINCE }} → today.** This branch is
            rebuilt from `main` each run, so anything published before that date is
            not in this PR even if an earlier run picked it up.

            Papers are deduplicated by DOI and normalized title, filtered for
            relevance, and heuristically classified into the v26 taxonomy.
            Please review classifications before merging — they are best-effort.
          branch: auto/scrape-papers
          add-paths: data/
          delete-branch: true
